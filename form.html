<!DOCTYPE html>
<html>
<head>
    <title>simple Form  in HTML</title>
</head>
<body>
    <h3>LGIC</h3>
    <form>
        <label for=" first name"> First Name:</label>
        <input type="text" placeholder="Enter your first name"><br><br>
         <label for=" last name"> Last Name:</label>
        <input type="text" placeholder="Enter your last name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
         <label for=" password"> Password:</label>
        <input type="password" placeholder="Enter your password"><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        Nationality:
        <select>
            <option value="nepalese">nepalese</option>
            <option value="american">American</option>
            <option value="indain">indian</option>
        </select><br><br>
        Date:
        <input type="datetime-local"/> <br><br>
        type checkboxes 
        <br/>
        playing<input type="checkbox" value="playing"/><br />
        Reading<input type="checkbox" value="playing"/><br />
        Dancing<input type="checkbox" value="playing"/><br />
         write about yourself:
         <!--<textarea>-->
            <textarea style="height: 100px; width: 200px">
                This is the content area</textarea>
            </textarea>
            <br />
            <!--<button>Log In</button>-->
            <input type="submit" value="submit"/>
            <input type="reset" value="Reset"/>


    </form>
</body>
</html>
