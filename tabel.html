<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<table border="1" >
    <tr>
        <th>Name</th>
        <th>Subjects</th>
    </tr>

    <tr>
        <td>Shital</td>
        <td>
            <table border="1">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>85</td>
                </tr>
                <tr>
                    <td>Web Technology</td>
                    <td>90</td>
                </tr>
            </table>
        </td>
    </tr>

</table>

</body>
</html>
